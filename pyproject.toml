[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "repoforge-agent"
version = "0.1.0"
description = "Bounded issue-to-patch workflows with AST context, test feedback, and reviewable evidence"
requires-python = ">=3.11"
dependencies = ["langgraph>=0.2,<2", "GitPython>=3.1.44,<4", "SQLAlchemy>=2.0,<3", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
repoforge = "repoforge.cli:main"

[tool.setuptools.packages.find]
include = ["repoforge*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "BLE", "PLW1510"]

[tool.pytest.ini_options]
testpaths = ["tests"]
