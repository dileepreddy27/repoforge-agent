name: verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: repoforge
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: repoforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U repoforge"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: docker pull python:3.11-slim
      - run: python -m pytest -q
        env:
          REPOFORGE_TEST_POSTGRES: postgresql+psycopg://repoforge:ci-only-password@localhost:5432/repoforge
          REPOFORGE_TEST_DOCKER: "1"
      - run: repoforge demo --docker --output work/ci-demo
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-demo-evidence
          path: |
            work/ci-demo/report.json
            work/ci-demo/report.html
            work/ci-demo/patch.diff
            work/ci-demo/pull-request.md
